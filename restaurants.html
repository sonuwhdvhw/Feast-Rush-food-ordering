<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Restaurants – FeastRush</title><link rel="stylesheet" href="styles.css"/></head>
<body>
<div class="bg-particles"><div class="bg-orb bg-orb-1"></div><div class="bg-orb bg-orb-2"></div><div class="bg-orb bg-orb-3"></div></div>
<div id="navbar-container"></div>
<div class="page-hero">
  <div class="section-tag">Explore</div>
  <h1>🌍 Global <span class="gradient-text">Restaurants</span></h1>
  <p style="color:var(--text-m);margin-top:8px;">Discover <strong id="total-count" style="color:var(--p1)">28</strong> restaurants from 14 countries</p>
  <div class="search-bar">
    <span style="color:var(--text-f);font-size:1.1rem;">🔍</span>
    <input type="text" id="search-input" placeholder="Search restaurant, city, or cuisine…" oninput="doFilter()"/>
    <button class="btn btn-primary btn-sm" onclick="doFilter()">Search</button>
  </div>
</div>
<div class="filters-bar">
  <button class="filter-btn active" data-f="all"       onclick="setFilter('all',this)">🌍 All</button>
  <button class="filter-btn" data-f="burgers"          onclick="setFilter('burgers',this)">🍔 Burgers</button>
  <button class="filter-btn" data-f="pizza"            onclick="setFilter('pizza',this)">🍕 Pizza</button>
  <button class="filter-btn" data-f="sushi"            onclick="setFilter('sushi',this)">🍣 Sushi</button>
  <button class="filter-btn" data-f="curry"            onclick="setFilter('curry',this)">🍛 Curry</button>
  <button class="filter-btn" data-f="mexican"          onclick="setFilter('mexican',this)">🌮 Mexican</button>
  <button class="filter-btn" data-f="bbq"              onclick="setFilter('bbq',this)">🥩 BBQ</button>
  <button class="filter-btn" data-f="italian"          onclick="setFilter('italian',this)">🍝 Italian</button>
  <button class="filter-btn" data-f="asian"            onclick="setFilter('asian',this)">🥢 Asian</button>
  <button class="filter-btn" data-f="seafood"          onclick="setFilter('seafood',this)">🦞 Seafood</button>
  <button class="filter-btn" data-f="french"           onclick="setFilter('french',this)">🥐 French</button>
  <button class="filter-btn" data-f="desserts"         onclick="setFilter('desserts',this)">🍰 Desserts</button>
  <button class="filter-btn" data-f="turkish"          onclick="setFilter('turkish',this)">🥙 Turkish</button>
</div>
<div style="max-width:1280px;margin:0 auto;padding:0 48px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:relative;z-index:1;">
  <span id="results-count" style="font-size:.85rem;color:var(--text-m);">Showing 28 restaurants</span>
  <select class="form-input" style="width:auto;padding:9px 40px 9px 14px;font-size:.82rem;" id="sort-sel" onchange="doFilter()">
    <option value="default">Sort: Featured</option>
    <option value="rating">Highest Rated</option>
    <option value="delivery">Fastest Delivery</option>
    <option value="fee">Lowest Fee</option>
  </select>
</div>
<div class="restaurants-page-grid" id="grid"></div>
<div id="no-results" style="display:none;text-align:center;padding:80px;color:var(--text-m);position:relative;z-index:1;">
  <div style="font-size:4rem;margin-bottom:16px;">🍽️</div>
  <h3 style="margin-bottom:8px;color:#fff;">No restaurants found</h3>
  <p>Try a different search or filter</p>
  <button class="btn btn-outline" style="margin-top:20px;" onclick="reset()">Clear Filters</button>
</div>
<footer class="footer" style="margin-top:40px;">
  <div class="footer-bottom" style="max-width:1280px;margin:0 auto;">
    <span>© 2026 FeastRush. All rights reserved.</span>
    <a href="index.html" style="color:var(--p1);text-decoration:none;">← Back to Home</a>
  </div>
</footer>
<script src="app.js"></script><script src="restaurants.js"></script>
<script>
buildNavbar('restaurants');
let curFilter='all',curSearch='',curSort='default';
const params=new URLSearchParams(window.location.search);
if(params.get('filter')){curFilter=params.get('filter');document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.f===curFilter));}
if(params.get('q')){curSearch=params.get('q');const si=document.getElementById('search-input');if(si)si.value=curSearch;}

function cardHTML(r){const f=FLAG_MAP[r.country]||'🌍';return`
  <a href="menu.html?id=${r.id}" class="restaurant-card animate-on-scroll">
    <div class="restaurant-banner"><img src="${r.image}" alt="${r.name}" loading="lazy"/>
      <div class="restaurant-banner-overlay"></div>
      ${r.badge?`<span class="restaurant-badge">${r.badge}</span>`:''}
      <span class="restaurant-country-tag">${f} ${r.city}</span>
    </div>
    <div class="restaurant-body">
      <div class="restaurant-name">${r.emoji} ${r.name}</div>
      <div class="restaurant-meta"><span class="rating">⭐ ${r.rating}</span><span>⏱ ${r.deliveryTime}min</span><span>🚚 $${r.deliveryFee}</span></div>
      <div style="font-size:.77rem;color:var(--text-m);margin-bottom:10px;">Min: <strong style="color:var(--price)">$${r.minOrder}</strong></div>
      <div class="restaurant-tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
  </a>`;}

function render(list){
  const grid=document.getElementById('grid'),nr=document.getElementById('no-results');
  document.getElementById('results-count').textContent=`Showing ${list.length} restaurant${list.length!==1?'s':''}`;
  if(!list.length){grid.innerHTML='';nr.style.display='block';return;}
  nr.style.display='none';grid.innerHTML=list.map(cardHTML).join('');initScrollAnimations();
}
function sortList(list){
  const s=[...list],v=document.getElementById('sort-sel').value;
  if(v==='rating') return s.sort((a,b)=>b.rating-a.rating);
  if(v==='delivery') return s.sort((a,b)=>parseInt(a.deliveryTime)-parseInt(b.deliveryTime));
  if(v==='fee') return s.sort((a,b)=>a.deliveryFee-b.deliveryFee);
  return s;
}
function doFilter(){
  curSearch=document.getElementById('search-input').value.trim();
  render(sortList(searchRestaurants(curSearch,curFilter)));
}
function setFilter(f,btn){
  curFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');doFilter();
}
function reset(){
  curFilter='all';curSearch='';document.getElementById('search-input').value='';document.getElementById('sort-sel').value='default';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.f==='all'));doFilter();
}
doFilter();
</script>
</body>
</html>
