<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Restaurants - FeastRush</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="bg-particles">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
</div>
<div id="navbar-container"></div>

<div class="page-hero">
  <div class="section-tag">Explore</div>
  <h1>&#127757; Global <span class="gradient-text">Restaurants</span></h1>
  <p style="color:#94A3B8;margin-top:8px;">
    Discover <strong style="color:#FF512F">20</strong> restaurants from 20 countries worldwide
  </p>
  <div class="search-bar">
    <span style="color:#64748B;font-size:1.1rem;">&#128269;</span>
    <input type="text" id="search-input" placeholder="Search restaurant, city, or cuisine..." oninput="doFilter()"/>
    <button class="btn btn-primary btn-sm" onclick="doFilter()">Search</button>
  </div>
</div>

<div class="filters-bar">
  <button class="filter-btn active" data-f="all"         onclick="setFilter('all',this)">&#127757; All</button>
  <button class="filter-btn" data-f="italian"            onclick="setFilter('italian',this)">&#127470;&#127481; Italian</button>
  <button class="filter-btn" data-f="indian"             onclick="setFilter('indian',this)">&#127470;&#127475; Indian</button>
  <button class="filter-btn" data-f="japanese"           onclick="setFilter('japanese',this)">&#127471;&#127477; Japanese</button>
  <button class="filter-btn" data-f="mexican"            onclick="setFilter('mexican',this)">&#127474;&#127485; Mexican</button>
  <button class="filter-btn" data-f="chinese"            onclick="setFilter('chinese',this)">&#127464;&#127475; Chinese</button>
  <button class="filter-btn" data-f="american"           onclick="setFilter('american',this)">&#127482;&#127480; American</button>
  <button class="filter-btn" data-f="thai"               onclick="setFilter('thai',this)">&#127481;&#127469; Thai</button>
  <button class="filter-btn" data-f="french"             onclick="setFilter('french',this)">&#127467;&#127479; French</button>
  <button class="filter-btn" data-f="turkish"            onclick="setFilter('turkish',this)">&#127481;&#127479; Turkish</button>
  <button class="filter-btn" data-f="greek"              onclick="setFilter('greek',this)">&#127468;&#127479; Greek</button>
  <button class="filter-btn" data-f="korean"             onclick="setFilter('korean',this)">&#127472;&#127479; Korean</button>
  <button class="filter-btn" data-f="vietnamese"         onclick="setFilter('vietnamese',this)">&#127483;&#127475; Vietnamese</button>
  <button class="filter-btn" data-f="spanish"            onclick="setFilter('spanish',this)">&#127466;&#127480; Spanish</button>
  <button class="filter-btn" data-f="moroccan"           onclick="setFilter('moroccan',this)">&#127474;&#127462; Moroccan</button>
  <button class="filter-btn" data-f="brazilian"          onclick="setFilter('brazilian',this)">&#127463;&#127479; Brazilian</button>
  <button class="filter-btn" data-f="british"            onclick="setFilter('british',this)">&#127468;&#127463; British</button>
  <button class="filter-btn" data-f="german"             onclick="setFilter('german',this)">&#127465;&#127466; German</button>
  <button class="filter-btn" data-f="egyptian"           onclick="setFilter('egyptian',this)">&#127466;&#127468; Egyptian</button>
  <button class="filter-btn" data-f="indonesian"         onclick="setFilter('indonesian',this)">&#127470;&#127465; Indonesian</button>
  <button class="filter-btn" data-f="canadian"           onclick="setFilter('canadian',this)">&#127464;&#127462; Canadian</button>
</div>

<div style="max-width:1280px;margin:0 auto;padding:0 48px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:relative;z-index:1;">
  <span id="results-count" style="font-size:.85rem;color:#94A3B8;">Showing 20 restaurants</span>
  <select class="form-input" style="width:auto;padding:9px 40px 9px 14px;font-size:.82rem;" id="sort-sel" onchange="doFilter()">
    <option value="default">Sort: Featured</option>
    <option value="rating">Highest Rated</option>
    <option value="delivery">Fastest Delivery</option>
    <option value="fee">Lowest Fee</option>
  </select>
</div>

<div class="restaurants-page-grid" id="grid"></div>

<div id="no-results" style="display:none;text-align:center;padding:80px;color:#94A3B8;position:relative;z-index:1;">
  <div style="font-size:4rem;margin-bottom:16px;">&#127869;</div>
  <h3 style="margin-bottom:8px;color:#fff;">No restaurants found</h3>
  <p>Try a different search or filter</p>
  <button class="btn btn-outline" style="margin-top:20px;" onclick="reset()">Clear Filters</button>
</div>

<footer class="footer" style="margin-top:40px;">
  <div class="footer-bottom" style="max-width:1280px;margin:0 auto;">
    <span>&#169; 2026 FeastRush. All rights reserved.</span>
    <a href="index.html" style="color:#FF512F;text-decoration:none;">&larr; Back to Home</a>
  </div>
</footer>

<script src="app.js"></script>
<script src="restaurants.js"></script>
<script>
buildNavbar('restaurants');

var curFilter = 'all', curSearch = '';

// Read URL params
var params = new URLSearchParams(window.location.search);
if(params.get('filter')){ curFilter = params.get('filter'); }
if(params.get('q')){ curSearch = params.get('q'); }

// Highlight active filter
document.querySelectorAll('.filter-btn').forEach(function(b){
  b.classList.toggle('active', b.dataset.f === curFilter);
});

// Set search input
var si = document.getElementById('search-input');
if(si && curSearch) si.value = curSearch;

function makeCard(r){
  var flag = FLAG_MAP[r.country] || '';
  return '<a href="menu.html?id='+r.id+'" class="restaurant-card animate-on-scroll">'
    + '<div class="restaurant-banner">'
    + '<img src="'+r.image+'" alt="'+r.name+'" loading="lazy"/>'
    + '<div class="restaurant-banner-overlay"></div>'
    + (r.badge ? '<span class="restaurant-badge">'+r.badge+'</span>' : '')
    + '<span class="restaurant-country-tag">'+flag+' '+r.city+'</span>'
    + '</div>'
    + '<div class="restaurant-body">'
    + '<div class="restaurant-name">'+r.emoji+' '+r.name+'</div>'
    + '<div class="restaurant-meta">'
    + '<span class="rating">&#11088; '+r.rating+'</span>'
    + '<span>&#9201; '+r.deliveryTime+' min</span>'
    + '<span>&#128666; $'+r.deliveryFee+'</span>'
    + '</div>'
    + '<div style="font-size:.77rem;color:#94A3B8;margin-bottom:10px;">Min: <strong style="color:#34D399">$'+r.minOrder+'</strong></div>'
    + '<div class="restaurant-tags">'
    + r.tags.map(function(t){ return '<span class="tag">'+t+'</span>'; }).join('')
    + '</div></div></a>';
}

function render(list){
  var grid = document.getElementById('grid');
  var nr = document.getElementById('no-results');
  document.getElementById('results-count').textContent = 'Showing '+list.length+' restaurant'+(list.length!==1?'s':'');
  if(!list.length){ grid.innerHTML=''; nr.style.display='block'; return; }
  nr.style.display = 'none';
  grid.innerHTML = list.map(makeCard).join('');
  initScrollAnimations();
}

function sortList(list){
  var s = list.slice();
  var v = document.getElementById('sort-sel').value;
  if(v==='rating') return s.sort(function(a,b){ return b.rating-a.rating; });
  if(v==='delivery') return s.sort(function(a,b){ return parseInt(a.deliveryTime)-parseInt(b.deliveryTime); });
  if(v==='fee') return s.sort(function(a,b){ return a.deliveryFee-b.deliveryFee; });
  return s;
}

function doFilter(){
  curSearch = document.getElementById('search-input').value.trim();
  render(sortList(searchRestaurants(curSearch, curFilter)));
}

function setFilter(f, btn){
  curFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  doFilter();
}

function reset(){
  curFilter='all'; curSearch='';
  document.getElementById('search-input').value='';
  document.getElementById('sort-sel').value='default';
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.f==='all'); });
  doFilter();
}

doFilter();
</script>
</body>
</html>
